[workspace]
members = [
    "crates/seedfinder-cli",
    "crates/seedfinder-core",
    "crates/seedfinder-session",
    "crates/seedfinder-wasm",
    "crates/seedfinder-jni",
    "crates/seedfinder-ffi",
    "linux",
]
resolver = "3"

[workspace.package]
version = "0.15.2"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Generation and complex query checks are prohibitively slow without optimization.
# Keep the test profile's debug assertions and overflow checks, including when
# the engine is exercised by the session, FFI, and WASM tests.
[profile.test.package.shpd-seedfinder-core]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
