[package]
name = "shpd-seedfinder-core"
description = "Version-pinned Shattered Pixel Dungeon seed search engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "shpd_seedfinder_core"

[features]
json-query = ["dep:serde", "dep:serde_json"]

[dependencies]
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }

# Self-reference so `cargo test -p shpd-seedfinder-core` always compiles the
# json-query modules (and their tests) even when no other workspace member
# happens to enable the feature.
[dev-dependencies]
shpd-seedfinder-core = { path = ".", features = ["json-query"] }

[lints]
workspace = true
